- title: "Mechanical properties of stromal striae, and their impact on corneal tissue behavior"
  author: "Qian Wu, Chloé Giraudet, Jean-Marc Allain"
  date: "2024-12-01"
  journal: "Journal of the Mechanical Behavior of Biomedical Materials"
  abstract: "Cornea is an essential element of our eye. The refractive power of the cornea is closely related to its shape, which depends on the balance between its mechanical properties and the intraocular pressure. However, in keratoconus, the shape of the cornea is altered, and the mechanical properties (i.e., elastic modulus and viscosity) are reduced. These alterations have been associated with the development of striae within the cornea. Recently, such striae have been observed in healthy corneas as well, but with slightly different shapes. Our study investigated the mechanical role of these striae. To this end, we performed an inflation test under Optical Coherence Tomography: tomographic volumes were acquired in the central zone of eleven human corneas during an inflation test. Striae planes were extracted from the segmented images, and principal deformation maps were obtained by Digital Volume Correlation (DVC). We observe that the pattern of the striae does not change with pressure, even far above physiological pressure. Maximum principal strains are co-localized with the striae and are oriented perpendicular to the striae. We also observe that principal deformations on the striae increase with depth in the cornea. Our results show that striae lead to greater deformability in the direction perpendicular to the striae, especially in the posterior part of the cornea where they are the most visible. This supports the idea that the striae are undulations in the cornea collagenous microstructure, which are progressively unfolded under loading. They decrease the global stiffness of the cornea, in particular in the posterior part, and thus may help in accommodating deformations."
  path: "https://doi.org/10.1016/j.jmbbm.2024.106770"
  description: "[DOI](https://doi.org/10.1016/j.jmbbm.2024.106770)"
  image: "resources/biblio/images/wu2024.png"
  categories: ["2024", "Journal Article"]
  tags: ["Cornea"]

- title: "Microrheology and structural quantification of hypercoagulable clots"
  author: "Laura Wolff-Trombini, Adrien Ceripa, Julien Moreau, Hubert Galinat, Chloe James, Nathalie Westbrook, Jean-Marc Allain"
  date: "2023-07-01"
  abstract: "Hypercoagulability is a pathology that remains difficult to explain today in most cases. It is likely due to a modification of the conditions of polymerization of the fibrin, the main clot component. Using passive microrheology, we measured the mechanical properties of clots and correlated them under the same conditions with structural information obtained with confocal microscopy. We tested our approach with known alterations: an excess of fibrinogen and of coagulation Factor VIII. We observed simultaneously a rigidification and densification of the fibrin network, showing the potential of microrheology for hypercoagulability diagnosis."
  journal: "Biomedical Optics Express"
  path: "https://doi.org/10.1364/boe.492669"
  description: "[DOI](https://doi.org/10.1364/boe.492669)"
  image: "resources/biblio/images/wolff-trombini2023.png"
  categories: ["2023", "Journal Article"]
  tags: ["Clot"]

- title: "Identification of PCPE-2 as the endogenous specific inhibitor of human BMP-1/tolloid-like proteinases"
  author: "Sandrine Vadon-Le Goff, Agnès Tessier, Manon Napoli, Cindy Dieryckx, Julien Bauer, Mélissa Dussoyer, Priscillia Lagoutte, Célian Peyronnel, Lucie Essayan, Svenja Kleiser, Nicole Tueni, Emmanuel Bettler, Natacha Mariano, Elisabeth Errazuriz-Cerda, Carole Fruchart Gaillard, Florence Ruggiero, Christoph Becker-Pauly, Jean-Marc Allain, Leena Bruckner-Tuderman, Alexander Nyström, Catherine Moali"
  date: "2023-12-01"
  abstract: "BMP-1/tolloid-like proteinases (BTPs) are major players in tissue morphogenesis, growth and repair. They act by promoting the deposition of structural extracellular matrix proteins and by controlling the activity of matricellular proteins and TGF-β superfamily growth factors. They have also been implicated in several pathological conditions such as fibrosis, cancer, metabolic disorders and bone diseases. Despite this broad range of pathophysiological functions, the putative existence of a specific endogenous inhibitor capable of controlling their activities could never be confirmed. Here, we show that procollagen C-proteinase enhancer-2 (PCPE-2), a protein previously reported to bind fibrillar collagens and to promote their BTP-dependent maturation, is primarily a potent and specific inhibitor of BTPs which can counteract their proteolytic activities through direct binding. PCPE-2 therefore differs from the cognate PCPE-1 protein and extends the possibilities to fine-tune BTP activities, both in physiological conditions and in therapeutic settings."
  journal: "Nature Communications"
  path: "https://doi.org/10.1038/s41467-023-43401-0"
  description: "[DOI](https://doi.org/10.1038/s41467-023-43401-0)"
  image: "resources/biblio/images/vadon2023.png"
  categories: ["2023", "Journal Article"]
  tags: ["Others"]

- title: "The Rapid Mechanically Activated (RMA) channel transduces increases in plasma membrane tension into transient calcium influx"
  author: "Yannick Guerringue, Sebastien Thomine, Jean-Marc Allain, Jean-Marie Frachisse"
  abstract: "Plants respond to mechanical stimuli by a rapid increase in cytosolic calcium. The intensity and kinetics of the calcium changes define calcium signatures important for biological responses. In this study, we determine the properties of a calcium-permeable force-gated channel localized at the plasma membrane called Rapid Mechanically Activated (RMA). Using patch clamp and pressure clamp, we characterized the kinetics of the Arabidopsis thaliana RMA channel upon stimulation by pressure pulses applied onto the plasma membrane. Combining pressure pulse protocols at different frequencies with modeling, we investigated the channel's capacity to transduce high frequency mechanical stimuli. The RMA channel rapidly activates in response to membrane tension, then it inactivates during prolonged stimulation. Upon repeated stimulations, the RMA current amplitude decreases irreversibly indicating that it undergoes attenuation. The channel kinetics were modeled with four chemical states and the model predicts that it behaves as a pass band filter in the 10 Hz–1 kHz range. In conclusion, due to its activation/inactivation, the RMA channel is a candidate for mediating cytosolic calcium signaling in response to mechanostimulation. Its attenuation and filtering properties suggest its involvement in the transduction of high frequency mechanical stimulation, such as those produced by insects' vibrations."
  date: "2025-08-01"
  journal: "openRxiv preprint"
  path: "https://doi.org/10.1101/2025.08.06.668926"
  description: "[DOI](https://doi.org/10.1101/2025.08.06.668926)"
  image: "resources/biblio/images/guerringue2025.png"
  categories: ["2025", "Preprint"]
  tags: ["Others"]

- title: "On the structural origin of the anisotropy in the myocardium: Multiscale modeling and analysis"
  author: "Nicole Tueni, Jean-Marc Allain, Martin Genet"
  abstract: "Due to structural heterogeneities within the tissue, the myocardium displays an orthotropic material behavior. However, the link between the microstructure and the macroscopic mechanical properties is still not fully established. In particular, if it is admitted that the cardiomyocyte organization induces a transversely isotropic symmetry, the relative role in the observed orthotropic symmetry of cardiomyocyte orientation variation and perimysium collagen “sheetlet” structure, two mechanisms occurring at different scales, is still a matter of debate. In order to shed light on this question, we designed a multiscale model of the myocardium, bridging the cell, sheetlet and tissue scales. More precisely, we compared the macroscopic anisotropy obtained by homogenization of different mesostructures consisting in cardiomyocytes and extracellular collageneous layers, also taking into account the variation of cardiomyocyte and sheetlet orientations on the macroscale, to available experimental data. This study confirms the importance of sheetlets layers in assuring the tissue’s anisotropic response, as cardiomyocytes-only mesostructures cannot reproduce the observed anisotropy. Moreover, our model shows the existence of a size effect in the myocardial tissue shear properties, which will require further experimental analysis."
  date: "2023-02-01"
  journal: "Journal of the Mechanical Behavior of Biomedical Materials"
  path: "https://doi.org/10.1016/j.jmbbm.2022.105600"
  description: "[DOI](https://doi.org/10.1016/j.jmbbm.2022.105600)"
  image: "resources/biblio/images/tueni2023.png"
  categories: ["2023", "Journal Article"]
  tags: ["Others"]

- title: "Volumetric mechanical properties of soft tissues measured by optical coherence tomography: application to corneal heterogeneity"
  author: "Chloé Giraudet, Qian Wu, Jean-Marc Allain"
  date: "2025-09-01"
  abstract: "Biological tissues have complex mechanical properties, which are deeply related to their function. It is thus needed to quantify the volumetric displacements induced by mechanical load, rather than only surface displacements. In this article, we propose to use Optical Coherence Tomography as a simple and fast method to quantify the volumetric deformation of the cornea under pressure. Indeed, the cornea plays a key role in vision, and any mechanical defect can impact the eye as it is under the intraocular pressure. Our observations show that, in the tangential direction, the cornea deforms more in the posterior than in the anterior region. In the depth direction, we observed a strong compression, with depth-dependent heterogeneity, delineating three distinct regions. This strong compression can be explained only by important outward water fluxes. Our study shows the complexity of human corneal mechanics, highlighting the need of adequate volumetric measure to characterize its strong anisotropy and depth-dependent behavior."
  journal: "Journal of the Mechanical Behavior of Biomedical Materials"
  path: "https://doi.org/10.1016/j.jmbbm.2025.107078"
  description: "[DOI](https://doi.org/10.1016/j.jmbbm.2025.107078)"
  image: "resources/biblio/images/giraudet2025.png"
  categories: ["2025", "Journal Article"]
  tags: ["Cornea"]

- title: "Assessment of Human Corneal Biomechanical Properties After Refractive Surgery With Inflation Test Using Optical Coherence Tomography"
  author: "Benjamin Memmi, Qian Wu, Vincent Borderie, Jean-Marc Allain"
  abstract: "Purpose: To evaluate the biomechanical properties of the cornea after refractive surgery using an inflation test combined with optical coherence tomography (OCT). Methods: Nine human donor corneas were divided into two groups: healthy (control) and treated (divided into three subgroups: photorefractive keratectomy [PRK], laser in situ keratomileusis [LASIK], and small incision lenticule extraction). Refractive treatments were applied to simulate -4.00 diopters of myopia correction. The corneas were mounted on an artificial anterior chamber, and an inflation test was performed using a custom set-up. Intraocular pressure was increased from 15 to 120 mm Hg in steps of 15 mm Hg, and corneal deformation was monitored via OCT imaging. The apex displacement versus IOP relationship was analyzed to calculate corneal stiffness, expressed as Young's modulus. Corneal thickness and curvature were also measured. Statistical comparisons were performed between healthy and treated corneas. Results: All treated corneas exhibited significant reductions in thickness and Young's modulus compared to the healthy group. The mean corneal thickness was 552.0 ± 5.9 µm in the healthy group and 486.9 ± 14.0 µm in the treated group (P < .05). Young's modulus was significantly lower in treated corneas (14.2 ± 4.9 MPa) compared to healthy corneas (22.9 ± 0.5 MPa, P = .02). Among surgical techniques, LASIK resulted in the greatest reduction in corneal stiffness, whereas PRK showed the least impact. Conclusions: Inflation testing combined with OCT imaging allows for precise assessment of biomechanical alterations following refractive surgery. These findings highlight the importance of considering biomechanical consequences when selecting refractive procedures."
  date: "2026-01-01"
  journal: "Journal of Refractive Surgery"
  path: "https://doi.org/10.3928/1081597x-20251202-03"
  description: "[DOI](https://doi.org/10.3928/1081597x-20251202-03)"
  image: "resources/biblio/images/memmi2026.png"
  categories: ["2026", "Journal Article"]
  tags: ["Cornea"]

- title: "Mechanical and numerical modelling of transient shear wave elastography for the cornea"
  author: "Giulia Merlini"
  abstract: "Recent advances in dynamic elastography have enabled rapid, localized, and non-invasive acquisition of corneal mechanical data, making these techniques promising for in-vivo applications. The primary aim of this thesis is the development of a computational model that could reproduce transient elastographic measurements and give access to mechanical properties of the cornea as a diagnostic tool. As a first step, we derive a variational formulation for linear wave propagation in hyperelastic, nearly incompressible and preloaded solids. The numerical approximation of wave propagation problems in nearly or pure incompressible solids faces several challenges such as locking and stability constraints. In this work we propose a stabilized Leapfrog scheme based on the use of Chebyshev polynomials to relax the stability condition. A 3D nonlinear static model of the cornea is developed to simulate the tissue's preloaded state under intraocular pressure. The anisotropic behavior, given by the presence of a complex collagen network within the cornea, is described with a microsphere model. By linearization, the constitutive behavior of the tissue is derived for the wave propagation problem, which is then solved using the previously described numerical method. Furthermore, we address the case where the assumption of linear wave propagation may not be sufficient. We propose the application of a novel numerical method for solving nonlinear elastodynamic problems. This fully explicit, three-step method ensures stability through a posteriori energy criterion. The nonlinear static model of the cornea is then coupled with the nonlinear wave propagation model. Finally, the impact of fluid interaction on elastic waves is studied using guided wave theory, modeling the cornea as an incompressible waveguide and solving the problem as a generalized eigenvalue problem with boundary conditions for fluid interaction."
  date: "2025-01-01"
  journal: "Agence Bibliographique de l’Enseignement Supérieur"
  path: "https://doi.org/10.70675/c8a4cfd8z4756z4935z86aaz1638d787c549"
  description: "[DOI](https://doi.org/10.70675/c8a4cfd8z4756z4935z86aaz1638d787c549)"
  image: "resources/biblio/images/merlini_phd.png"
  categories: ["2025", "PhD Manuscript"]
  tags: ["Cornea"]

- title: "Finite element modeling of transient shear wave elastography for the cornea"
  author: "Giulia Merlini, Sebastien Imperiale, Jean-Marc Allain"
  abstract: "Recent advances in dynamic elastography have enabled rapid, localized, and non-invasive mechanical data acquisition of the cornea. This data opens the path to early-detection of pathologies and more accurate treatment. However, the analysis of the wave propagation is a complex mechanical problem: the cornea is a structure under pressure, with non-linear material behavior. Thus, computational analysis are needed to extract mechanical parameters from the data. In this study, we present a time-dependent finite element model for the reproduction of transient shear wave elastographic measurements in the cornea. The mechanical problem consists in a small-amplitude wave propagating in the cornea, largely deformed by intraocular pressure in physiological conditions. The model accounts for anisotropic, hyperelastic, and incompressible behavior of the cornea, as well as its accurate geometry and preloaded condition. We have implemented two different numerical approaches to solve first the static non-linear inflation of the cornea and then the linear wave propagation problem to reproduce the measurements. We investigate the impact of material anisotropy and prestress on wave propagation and demonstrate that intraocular pressure critically influences shear wave velocity. Additionally, by introducing a localized mechanical defect to simulate a pathological defect, we show that simulated shear wave can detect and quantify mechanical weaknesses, suggesting potential as a diagnostic tool to assess corneal health."
  date: "2026-01-01"
  journal: "Journal of the Mechanics and Physics of Solids"
  path: "https://doi.org/10.1016/j.jmps.2025.106363"
  description: "[DOI](https://doi.org/10.1016/j.jmps.2025.106363)"
  image: "resources/biblio/images/merlini2026.png"
  categories: ["2026", "Journal Article"]
  tags: ["Cornea"]

- title: "Fully explicit numerical scheme for linearized wave propagation in nearly-incompressible soft hyperelastic solids"
  author: "Giulia Merlini, Jean-Marc Allain, Sébastien Imperiale"
  abstract: "The numerical approximation of wave propagation problems in nearly or pure incompressible solids faces several challenges such as locking and stability constraints. In this work we propose a stabilized Leapfrog scheme based on the use of Chebyshev polynomials to relax the stability condition, which is strongly limited by the enforcement of incompressibility. The scheme is fully explicit, second order accurate and energy-preserving. For the space discretization we use a mixed formulation with high-order spectral elements and mass-lumping. A strategy is proposed for an efficient and accurate computation of the pressure contribution with a new definition of the discrete Grad-div operator. Finally, we consider linear wave propagation problems in nearly-incompressible hyperelastic solids subject to static preload."
  date: "2025-11-01"
  journal: "Wave Motion"
  path: "https://doi.org/10.1016/j.wavemoti.2025.103594"
  description: "[DOI](https://doi.org/10.1016/j.wavemoti.2025.103594)"
  image: "resources/biblio/images/merlini2025.png"
