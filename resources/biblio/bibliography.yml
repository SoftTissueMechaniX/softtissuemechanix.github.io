- title: "Volumetric strain measurements in human cornea : characterization of deswelling, inflation responses and stromal striae microstructures"
  author: "Qian Wu"
  date: "2025-01-01"
  journal: "Agence Bibliographique de l’Enseignement Supérieur"
  path: "https://doi.org/10.70675/487b8bb4z38b1z4acaz949czae42c4f5b263"
  description: "[DOI](https://doi.org/10.70675/487b8bb4z38b1z4acaz949czae42c4f5b263)"
  abstract: "The human cornea, as the eye's outermost transparent layer, plays a vital role in its refractive power. The geometry of the cornea is crucial, as any irregularities can affect its function and visual performance.The stroma makes up about 90% of the cornea's thickness and mainly determines its mechanical properties due to its highly organized collagen structure. Stroma striae, vertical lines in the posterior cornea, can be observed in both healthy and pathological corneas, but they appear morefrequently and are more pronounced in patients with pathologies such as keratoconus.In this thesis, we primarily focus on the biomechanics of the healthy human cornea. Our interest lies in understanding the mechanical properties of the cornea and how they relate to its microstructure. To this end, we coupled Optical Coherence Tomography (OCT) with mechanical testing. Our findings reveal that the cornea exhibits both anisotropy and heterogeniety, particularly in the thickness. We also discovered that stromal striae are fold-like structures at the microscale, and regions containing these striae exhibit greater deformation perpendicular to their orientation compared to the neighboring areas. At an even finer scale, observed using Second Harmonic Generation (SHG) microscopy, we found that this deformation correlates with changes in collagen orientation. Additionally, we observed that the cornea is highly sensitive to its surrouding environment due to its porosity and its osmotic equilibrium with external conditions. This presents challenges for corneal deswelling procedures aimed at restoring physiological thickness and hydration. To address this, we proposed an optimized protocol for effective corneal deswelling."
  image: "resources/biblio/images/wu_phd.png"
  categories: ["2025", "PhD Manuscript"]
  tags: ["Cornea"]

