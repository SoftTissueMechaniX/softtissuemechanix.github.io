- title: "Aortic smooth muscle cells keep their spindle-shaped morphotype in low density collagen hydrogels"
  author: "Chloé Techens, Amira Ben Hassine, Edwin-Joffrey Courtial, David Eglin, Stéphane Avril"
  date: "2026-03-01"
  journal: "Journal of the Mechanical Behavior of Biomedical Materials"
  abstract: "Smooth muscle cells (SMCs) of elastic arteries are essential to maintain mechanical homeostasis in the media layer. However, investigating the SMCs mechanoregulation mechanisms important to understand homeostasis and diseases progression, is hampered by a lack of in vitro model replicating realistic biological conditions. Indeed, previous studies have mainly been performed on 2D surfaces rather than in a 3D environment replicating more closely the tissue mechanics and composition. Thus, the objective of this study was to optimize a collagen hydrogel embedding SMCs 3D culture model where the “contractile” phenotype expressed by SMCs in healthy aortas, assessed by a spindle-shaped morphotype will be reproduced and conserved. A Design of Experiment (DoE) was established where 12 chemically different hydrogels were tested varying pH and collagen concentrations (7.4/7.7/8, 2.5/5.0/7.5/10.0 mg/mL) with 3 cell densities (50 000/100 000/150 000 cells/mL). SMCs contractile morphotype was optimal for low-collagen concentration hydrogels seeded at SMCs density of 100 000 cells/mL, independently of the hydrogel pH. The study provided an overview of the adaptation of the SMC population to the matrix shear modulus and viscosity, and provide a parameterized 3D model to study mechanoregulation of SMCs."
  path: "https://doi.org/10.1016/j.jmbbm.2025.107323"
  description: "[DOI](https://doi.org/10.1016/j.jmbbm.2025.107323)"
  image: "resources/biblio/images/teschens2026.png"
  categories: ["2026", "Journal Article"]
  tags: ["Hydrogel"]

- title: "Biointegration of a partially decellularized tracheal scaffold in a porcine model - preliminary results"
  author: "Augustin Vigouroux, Yannis Bonnin, Nicolas Gendron, Sabrina Kellouche, Rémy Agniel, Patrick Bruneval, Daniel Balvay, Jean-Marc Allain, Stéphanie Chhun, Hervé Kempf, Romain Hugon, Magali Devriese, Caroline Sansac, Jérôme Larghero, Lousineh Arakelian, Briac Thierry"
  date: "2026-02-01"
  abstract: "Some pediatric tracheal pathologies remain therapeutic dead ends for which current palliative strategies are fraught with serious complications. With the aim of a tracheal replacement, our team has previously developed and patented a clinical grade partially decellularized trachea (PDT) from porcine tracheas. The aim of this work was to study and compare the biointegration mechanisms of this PDT in vivo, in a pig cervical muscle, with or without immunosuppressant. The secondary objective was to evaluate the optimal maturation time of the PDT in this heterotopic position. In total, 11 female Large White/Landrace pigs, weighing between 50 and 70 kg were included in this study. The mean age of the animals at the implantation was 4.8 months. The PDTs were implanted in a cervical muscle of pigs for either 28 days, with or without cyclosporin A treatment, or for 56 days without immunosuppression. Histological evaluation showed very good PDT biointegration, characterized by neovascularization and fibroblast colonization, and no detectabale infection. Additionally, tissue and blood analyses showed no signs of graft rejection or surrounding tissue necrosis. Immunosuppression did not show any superiority in terms of biointegration after 28 days of treatment. After 56 days of implantation, a more significant degradation of the cartilage. Therefore, the optimal condition for PDT maturation proved to be 28 days, without immunosuppression."
  journal: "Scientific Reports"
  path: "https://doi.org/10.1038/s41598-026-37823-1"
  description: "[DOI](https://doi.org/10.1038/s41598-026-37823-1)"
  image: "resources/biblio/images/vigouroux2026.png"
  categories: ["2026", "Journal Article"]
  tags: ["Others"]

- title: "Community challenge towards consensus on characterization of biological tissue: C4Bio’s first findings"
  author: "Nele Famaey, Heleen Fehervary, Yoann Lafon, Ali Akyildiz, Silke Dreesen, Karine Bruyère-Garnier, Jean-Marc Allain, Marta Alloisio, Alejandro Aparici-Gil, Chiara Catalano, Fanette Chassagne, Snehal Chokhandre, Kimberly Crevits, Hanneke Crielaard, Eoghan Cunnane, Connor Cunnane, Karen De Leener, Amisha Desai, Rob Driessen, Ahmet Erdemir, Mona Eskandari, Sam Evans, Christian Gasser, Marc Gebhardt, Birgit Glasmacher, Gerhard A. Holzapfel, Mikel Isasi, Louise Jennings, Sascha Kurz, Sara Leal-Marin, Pauline Lecomte, Annie Morch, John Mulvihill, Fulufhelo Nemavhola, Thanyani Pandelani, Salvatore Pasta, Estefania Peña, Baptiste Pierrat, Heidi-Lynn Ploeg, Stanislav Polzer, Manuel Rausch, David Schwarz, Hazel Screen, Selda Sherifova, Gerhard Sommer, Shengzhang Wang, Darragh Walsh, Deepesh Yadav, Thierry Marchal, Liesbet Geris"
  date: "2026-01-01"
  abstract: "This study investigates methodological variability across various expert laboratories worldwide, with regards to characterizing the mechanical properties of biological tissues. Two testing rounds were conducted on the specific use case of uniaxial tensile testing of porcine aorta. In the first round, 24 labs were invited to apply their established methods to assess inter-laboratory variability. This revealed significant methodological diversity and associated variability in the stress–stretch results, underscoring the necessity for a standardized approach. In the second round, a consensus protocol was collaboratively developed and adopted by 19 labs in an attempt to minimize variability. This involved standardized sample preparation and uniformity in testing protocol, including the use of a common cutting and thickness measurement tool. Despite protocol harmonization, significant variability persisted across labs, which could not be solely attributed to inherent biological differences in tissue samples. These results illustrate the challenges in unifying testing methods across different research settings, underlining the necessity for further refinement of testing practices. Enhancing consistency in biomechanical experiments is pivotal when comparing results across studies, as well as when using the resulting material properties for in silico simulations in medical research."
  journal: "Journal of Biomechanics"
  path: "https://doi.org/10.1016/j.jbiomech.2025.113021"
  description: "[DOI](https://doi.org/10.1016/j.jbiomech.2025.113021)"
  image: "resources/biblio/images/famaey2026.png"
  categories: ["2026", "Journal Article"]
  tags: ["Others"]

- title: "Development of a rabbit model of uterine rupture after caesarean section, histological, biomechanical and polarimetric analysis of the uterine tissue"
  author: "Elodie Debras, Constance Maudot, Jean-Marc Allain, Angelo Pierangelo, Aymeric Courilleau, Julie Riviere, Michèle Dahirel, Christophe Richard, Valérie Gelin, Gwendoline Morin, Perrine Goussault Capmas, Pascale Chavatte-Palmer"
  date: "2025-09-01"
  abstract: "Uterine rupture is a major complication of caesarean section (CS) associated with high fetal and maternal morbidity. The objective is to develop an in vivo model of uterine healing and rupture after CS in order to analyse histological phenomena controlling scarring tissue development and potential causes of defects. Eighteen pregnant primiparous female rabbits were bred naturally. At caesarean, after 28 days of gestation, foetuses were either extracted through a longitudinal incision in one of the uterine horns ('CS horn') or via a short incision at the tip of the contralateral horn ('control horn'). The uterine horns were sutured in a single layer, all by the same surgeon. They were mated again 14 days later and euthanised at G28. Genital tracts were collected for histological, biomechanical and polarimetric analyses. Macroscopically, 2/18 presented a dehiscence and 1/18 a spontaneous rupture. The mean thickness of the scarred area was significantly lower, 0.9 mm (0.7-1.4), than the non-scarred area on CS horns 2.2 (1.6-2.3) or control horns 2 (1.5-2.3) (P < 0.0001). The scar zone was statistically more fibrous (P < 0.0001), containing fewer vessels (P = 0.03), oestrogen receptors (P < 0.001) and progesterone receptors (P < 0.0001). After balloon inflation, rupture occurred in the scar zone in 8 out of 17 cases (47%). Polarimetry revealed that the scar zone was statistically inhomogeneous (73%). Multifactorial analysis identified groups with poor uterine healing and less resistance to rupture (balloon inflation), mostly in cases of thin myometrium in the scar, and a group with strong resistance to rupture and correct healing characteristics."
  journal: "Reproduction and Fertility"
  path: "https://doi.org/10.1530/raf-25-0018"
  description: "[DOI](https://doi.org/10.1530/raf-25-0018)"
  image: "resources/biblio/images/debras2025.png"
  categories: ["2025", "Journal Article"]
  tags: ["Others"]

- title: "Mechanics of pressurized cellular sheets"
  author: "Thomas G. J. Chandler, Jordan Ferria, Oliver Shorthose, Jean-Marc Allain, Perla Maiolino, Arezki Boudaoud, Dominic Vella"
  abstract: "Everyday experience shows that cellular sheets are stiffened by the presence of a pressurized gas: from bicycle inner tubes to bubble wrap, the presence of an internal pressure increases the stiffness of otherwise floppy structures. The same is true of plants, with turgor pressure (due to the presence of water) taking the place of gas pressure; indeed, in the absence of water, many plants wilt. However, the mechanical basis of this stiffening is somewhat opaque: simple attempts to rationalize it suggest that the stiffness should be independent of the pressure, at odds with everyday experience. Here, we study the mechanics of sheets that are a single-cell thick and show how a pressure-dependent bending stiffness may arise. Our model rationalizes observations of turgor-driven shrinkage in plant cells and also suggests that turgor is unlikely to provide significant structural support in many monolayer leaves, such as those found in mosses. However, for such systems, turgor does provide a way to control leaf shape, in accordance with observations of curling upon drying of moss leaves. Guided by our results, we also present a biomimetic actuator that uncurls upon pressurization."
  date: "2025-02-01"
  journal: "Journal of The Royal Society Interface"
  path: "https://doi.org/10.1098/rsif.2024.0653"
  description: "[DOI](https://doi.org/10.1098/rsif.2024.0653)"
  image: "resources/biblio/images/merlini2025b.png"
  categories: ["2025", "Journal Article"]
