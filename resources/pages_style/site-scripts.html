<!-- =====================================================================
     SoftTissueMechaniX — global scripts (inlined in every page through
     `include-after-body` in _quarto.yml, so no relative-path issues in
     sub-folders such as members/ or news/).
     ===================================================================== -->
<script>
(function () {
  document.documentElement.classList.add('stm-js');

  /* ---------------------------------------------------------------
     1. Anti-spam e-mails
        Nothing in the generated HTML contains "name@domain", so
        harvesting robots that read the raw page find nothing.
        Usage (anywhere: page body, listing description...):
          <span class="stm-email" data-user="first.last" data-domain="polytechnique.edu"></span>
        Usage in YAML `about: links:`:
          href: "#email:first.last:polytechnique.edu"
     --------------------------------------------------------------- */
  function protectEmails() {
    document.querySelectorAll('.stm-email:not([data-done])').forEach(function (el) {
      var addr = el.dataset.user + '@' + el.dataset.domain;
      el.textContent = '';
      if (el.closest('a')) {               // e.g. inside a listing card link
        el.textContent = addr;
      } else {
        var a = document.createElement('a');
        a.href = 'mai' + 'lto:' + addr;
        a.textContent = addr;
        el.appendChild(a);
      }
      el.dataset.done = '1';
    });
    document.querySelectorAll('a[href*="#email:"]').forEach(function (a) {
      var h = a.getAttribute('href');           // Quarto may prefix it with "/"
      var p = h.slice(h.indexOf('#email:') + 7).split(':');
      a.setAttribute('href', 'mai' + 'lto:' + p[0] + '@' + p[1]);
    });
  }

  /* ---------------------------------------------------------------
     2. Reveal-on-scroll: any element with class "reveal"
     --------------------------------------------------------------- */
  var revealObserver = ('IntersectionObserver' in window)
    ? new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-visible'); revealObserver.unobserve(e.target); }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' })
    : null;
  window.stmReveal = function (root) {
    (root || document).querySelectorAll('.reveal:not(.is-visible)').forEach(function (el) {
      if (revealObserver) revealObserver.observe(el); else el.classList.add('is-visible');
    });
  };

  /* ---------------------------------------------------------------
     3. Expose the real navbar height (for sticky sub-menus)
     --------------------------------------------------------------- */
  function navHeight() {
    var h = document.getElementById('quarto-header');
    if (h) document.documentElement.style.setProperty('--stm-nav-h', h.offsetHeight + 'px');
  }

  function init() { protectEmails(); window.stmReveal(); navHeight(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  window.addEventListener('resize', navHeight);
})();
</script>
